name: 🚀 Feature Request
description: Suggest an idea or new feature for UACC
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome feature ideas and suggestions to make UACC the best computer control MCP server!

  - type: textarea
    id: feature_summary
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen or what tool signature you'd like added.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or MCP tool specifications about the feature request here.
    validations:
      required: false
